<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Анализ изображений</title>

    <!--STYLE-->
</head>

<body>
    <main>
        <section>
            <small>ИНСТРУМЕНТ АНАЛИЗА</small>
            <h1>Анализ изображений</h1>

            <div class="actions">
                <label>
                    <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2M3 7v12a2 2 0 0 0 2 2h13a2 2 0 0 0 2-1.5L23 9H7L3 19"/>
                    </svg>

                    Выбрать папку

                    <input
                        id="folder"
                        type="file"
                        webkitdirectory
                        multiple
                        hidden
                    >
                </label>

                <label>
                    <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="7" y="6" width="13" height="15" rx="2"/>
                        <path d="M16 3H5a2 2 0 0 0-2 2v12"/>
                    </svg>

                    Выбрать файлы

                    <input
                        id="files"
                        type="file"
                        multiple
                        hidden
                    >
                </label>

                <button id="stop" disabled>
                    <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M9 5H6v14h3zM18 5h-3v14h3z"/>
                    </svg>

                    <span>Остановить</span>
                </button>
            </div>

            <div id="drop">
                Перетащите файлы или папки сюда
            </div>
        </section>

        <div class="stats">
            <article>
                Файлов
                <strong id="total">0</strong>
            </article>

            <article>
                Обработано
                <strong id="done">0</strong>
            </article>

            <article>
                Ошибок
                <strong id="errors">0</strong>
            </article>

            <article>
                Время
                <strong id="time">—</strong>
            </article>

            <article>
                Общий размер
                <strong id="volume">0 Б (0 МБ)</strong>
            </article>
        </div>

        <section class="results">
            <div class="toolbar">
                <h2>Результаты</h2>

                <input
                    id="search"
                    placeholder="Поиск по имени"
                >

                <select id="filter">
                    <option value="">Все форматы</option>
                    <option>JPEG</option>
                    <option>GIF</option>
                    <option>TIFF</option>
                    <option>BMP</option>
                    <option>PNG</option>
                    <option>PCX</option>
                    <option value="other">Другое</option>
                </select>

                <select id="statusFilter">
                    <option value="">Все статусы</option>
                    <option value="ok">ОК</option>
                    <option value="bad">Повреждено</option>
                </select>
            </div>

            <div class="progress-line">
                <progress
                    id="progress"
                    value="0"
                    max="1"
                    aria-label="Прогресс анализа"
                ></progress>

                <span id="percent">0%</span>
            </div>

            <p id="status">
                Выберите файлы для начала анализа.
            </p>

            <div class="scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Имя файла</th>
                            <th>Формат</th>
                            <th>Размер, px</th>
                            <th>DPI X × Y</th>
                            <th>Бит/пиксель</th>
                            <th>Сжатие</th>
                            <th>Статус</th>
                        </tr>
                    </thead>

                    <tbody id="rows"></tbody>
                </table>
            </div>

            <div class="pagination">
                <div id="pageButtons"></div>
            </div>
        </section>
    </main>

    <dialog id="detail">
        <button id="close">Закрыть ×</button>

        <h2 id="filename"></h2>

        <img
            id="preview"
            alt="Изображение файла"
            hidden
        >

        <p id="previewMessage" hidden></p>

        <dl id="info"></dl>
    </dialog>

    <!--SCRIPT-->
</body>

</html>
